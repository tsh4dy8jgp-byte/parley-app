# Builds the Parley desktop app on each OS (PyInstaller can't cross-compile) and runs its self-test.
# Run it by hand from the Actions tab, or push a tag like v0.1.0 to also attach the builds to a release.
name: Build app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]   # Windows x64, Apple Silicon, Intel Mac
    runs-on: ${{ matrix.os }}
    env:   # job-level so the steps' `if` can test whether a secret exists
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check that Tk works
        run: python -c "import tkinter; tkinter.Tk().destroy()"
      - name: Install
        run: python -m pip install -e ".[gui,build]"
      # Signing is optional: without the secrets below the builds are unsigned (see README).
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KCPASS="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
      - name: Decode Windows signing certificate
        if: runner.os == 'Windows' && env.WIN_CERT_PFX != ''
        shell: bash
        env:
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
        run: |
          echo "$WIN_CERT_PFX" | base64 --decode > "$RUNNER_TEMP/codesign.pfx"
          echo "WIN_SIGN_PFX=$RUNNER_TEMP/codesign.pfx" >> "$GITHUB_ENV"
      - name: Build and self-test
        run: python packaging/build.py --online   # --online: the self-test also synthesizes one line
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          WIN_SIGN_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: parley-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
