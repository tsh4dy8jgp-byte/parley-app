[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parley"
version = "0.1.0"
description = "Parley: from one narrator to a full cast. Audiobooks and multi-voice dialogues with Microsoft Edge neural TTS voices"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "edge-tts>=6.1.0",
]

[project.optional-dependencies]
dialog = [
    "pydub>=0.25",
    "pyyaml>=6",
    "audioop-lts; python_version>='3.13'",   # pydub needs audioop, removed from Python 3.13
]
gui = [                                      # Parley desktop window (parley.py)
    "customtkinter>=5.2",
    "tkinterdnd2>=0.4",                      # drag and drop of .txt / .md files
    "pydub>=0.25",
    "audioop-lts; python_version>='3.13'",
]
dev = ["pytest>=7"]
build = ["pyinstaller>=6.16", "pillow"]      # packaging/build.py; Pillow turns the .ico into .icns

[project.scripts]
audiobook = "parley.audiobook.cli:main"
dialog-tts = "parley.dialog_tts.cli:main"
parley = "parley.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
parley = ["parley.ico"]                      # window icon

[tool.pytest.ini_options]
testpaths = ["tests"]
